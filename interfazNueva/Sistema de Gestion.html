// ═══════════════════════════════════════════════════════
//  INVENTORY MODULE
// ═══════════════════════════════════════════════════════
const InventoryModule = ({ accentColor }) => {
  const [products, setProducts] = useState(SAMPLE_PRODUCTS);
  const [search, setSearch] = useState("");
  const [modalOpen, setModalOpen] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({ id: "", name: "", stock: "", min: "", price: "", supplier: "" });

  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(search.toLowerCase()) ||
    p.id.toLowerCase().includes(search.toLowerCase())
  );

  const openNew = () => {
    setForm({ id: `SKU-00${products.length + 1}`, name: "", stock: "", min: "", price: "", supplier: "" });
    setEditItem(null);
    setModalOpen(true);
  };
  const openEdit = (ri) => {
    const p = filtered[ri];
    setForm({ ...p });
    setEditItem(ri);
    setModalOpen(true);
  };
  const saveForm = () => {
    if (editItem !== null) {
      setProducts(prev => prev.map(p => p.id === form.id ? { ...form, stock: +form.stock, min: +form.min, price: +form.price } : p));
    } else {
      setProducts(prev => [...prev, { ...form, stock: +form.stock, min: +form.min, price: +form.price }]);
    }
    setModalOpen(false);
  };
  const deleteItem = (ri) => {
    const p = filtered[ri];
    setProducts(prev => prev.filter(x => x.id !== p.id));
  };

  return (
    <div style={{ height: "100%", overflowY: "auto", padding: "24px 28px" }}>
      <PageHeader title="Inventario de Productos" subtitle={`${products.length} productos registrados`}
        actions={<Button icon="plus" onClick={openNew}>Nuevo Producto</Button>} />

      {/* Summary */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 20 }}>
        <StatCard icon="box" iconBg="#EFF6FF" iconColor={accentColor} label="Total Productos" value={products.length} />
        <StatCard icon="check" iconBg="#F0FDF4" iconColor="#16A34A" label="En Stock Normal" value={products.filter(p=>p.stock>p.min).length} />
        <StatCard icon="alert" iconBg="#FFFBEB" iconColor="#D97706" label="Stock Bajo" value={products.filter(p=>p.stock>0&&p.stock<=p.min).length} />
        <StatCard icon="close" iconBg="#FEF2F2" iconColor="#DC2626" label="Agotados" value={products.filter(p=>p.stock===0).length} />
      </div>

      <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #E8EDF2", boxShadow: "0 1px 4px rgba(0,0,0,0.05)" }}>
        <div style={{ padding: "14px 18px", borderBottom: "1px solid #F1F5F9", display: "flex", gap: 8, alignItems: "center" }}>
          <SearchBar placeholder="Buscar por nombre o código..." value={search} onChange={e => setSearch(e.target.value)} />
          <Button icon="filter" variant="secondary" size="sm">Filtrar</Button>
          <Button icon="download" variant="secondary" size="sm">Exportar</Button>
        </div>
        <Table
          columns={["Código", "Producto", "Stock", "Mín.", "Precio", "Proveedor", "Estado"]}
          rows={filtered.map(p => [
            <span style={{ fontFamily: "monospace", fontSize: 12, color: "#64748B" }}>{p.id}</span>,
            <span style={{ fontWeight: 600, color: "#0F172A" }}>{p.name}</span>,
            <span style={{ fontWeight: 700, color: p.stock === 0 ? "#DC2626" : p.stock <= p.min ? "#D97706" : "#16A34A" }}>{p.stock}</span>,
            p.min,
            <span>${p.price}</span>,
            p.supplier,
            <Badge label={p.stock === 0 ? "Agotado" : p.stock <= p.min ? "Stock bajo" : "Normal"}
              variant={p.stock === 0 ? "danger" : p.stock <= p.min ? "warning" : "success"} />,
          ])}
          onEdit={openEdit}
          onDelete={deleteItem}
        />
      </div>

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editItem !== null ? "Editar Producto" : "Nuevo Producto"}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
          <Field label="Código SKU" required><Input value={form.id} onChange={e => setForm({...form, id: e.target.value})} placeholder="SKU-001" /></Field>
          <Field label="Proveedor"><Input value={form.supplier} onChange={e => setForm({...form, supplier: e.target.value})} placeholder="Nombre del proveedor" /></Field>
        </div>
        <Field label="Nombre del Producto" required><Input value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Descripción del producto" /></Field>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "0 16px" }}>

const NAV_ITEMS = [
  { id: "dashboard", icon: "dashboard", label: "Dashboard" },
  { id: "inventory", icon: "inventory", label: "Inventario" },
  { id: "fiscal", icon: "fiscal", label: "Máquinas Fiscales" },

const Sidebar = ({ active, onNavigate, collapsed, accentColor }) => {
  const [hovered, setHovered] = useState(null);
  const lowStock = SAMPLE_PRODUCTS.filter(p => p.stock <= p.min).length;
  const pendingServices = SAMPLE_SERVICES.filter(s => s.status === 0).length;
  const badges = { inventory: lowStock > 0 ? lowStock : null, services: pendingServices > 0 ? pendingServices : null };

  return (
    <div style={{
      width: collapsed ? 64 : 230, flexShrink: 0,
      background: "#1A2235", height: "100%",
      display: "flex", flexDirection: "column",
      transition: "width 0.25s ease",
      overflow: "hidden",
    }}>
      {/* Logo */}
      <div style={{ padding: collapsed ? "20px 0" : "20px 18px", display: "flex", alignItems: "center", gap: 10, borderBottom: "1px solid rgba(255,255,255,0.07)", justifyContent: collapsed ? "center" : "flex-start" }}>
        <div style={{ width: 32, height: 32, background: accentColor, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <Icon name="printer" size={16} color="#fff" />
        </div>
        {!collapsed && <div>
          <div style={{ color: "#fff", fontWeight: 800, fontSize: 13, lineHeight: 1 }}>SistemaFiscal</div>
          <div style={{ color: "rgba(255,255,255,0.4)", fontSize: 10 }}>Gestión Integral</div>
        </div>}
      </div>

      {/* Nav */}
      <nav style={{ flex: 1, padding: "12px 8px", display: "flex", flexDirection: "column", gap: 2, overflowY: "auto" }}>
        {NAV_ITEMS.map(item => {
          const isActive = active === item.id;
          const isHovered = hovered === item.id;
          return (
            <button key={item.id}
              onClick={() => onNavigate(item.id)}
              onMouseEnter={() => setHovered(item.id)}
              onMouseLeave={() => setHovered(null)}
              title={collapsed ? item.label : undefined}
              style={{
                display: "flex", alignItems: "center", gap: 10,
                padding: collapsed ? "10px" : "10px 12px",
                borderRadius: 8, border: "none", cursor: "pointer",
                background: isActive ? accentColor : isHovered ? "rgba(255,255,255,0.07)" : "transparent",
                color: isActive ? "#fff" : "rgba(255,255,255,0.65)",
                fontFamily: "inherit", fontSize: 13, fontWeight: isActive ? 600 : 400,
                transition: "all 0.15s",
                justifyContent: collapsed ? "center" : "flex-start",
                position: "relative",
              }}>
              <Icon name={item.icon} size={17} color={isActive ? "#fff" : "rgba(255,255,255,0.65)"} />
              {!collapsed && <span style={{ flex: 1, textAlign: "left" }}>{item.label}</span>}
              {!collapsed && badges[item.id] && (
                <span style={{ background: "#EF4444", color: "#fff", fontSize: 10, fontWeight: 700, padding: "1px 6px", borderRadius: 10, minWidth: 18, textAlign: "center" }}>
                  {badges[item.id]}
                </span>
              )}
              {collapsed && badges[item.id] && (
                <span style={{ position: "absolute", top: 6, right: 6, width: 8, height: 8, background: "#EF4444", borderRadius: "50%" }} />
              )}
            </button>
          );
        })}
      </nav>

      {/* Bottom */}
      <div style={{ padding: "12px 8px", borderTop: "1px solid rgba(255,255,255,0.07)" }}>
        <button style={{
          display: "flex", alignItems: "center", gap: 10,
          padding: collapsed ? "10px" : "10px 12px", width: "100%",
          borderRadius: 8, border: "none", cursor: "pointer",
          background: "transparent", color: "rgba(255,255,255,0.45)",
          fontFamily: "inherit", fontSize: 13,
          justifyContent: collapsed ? "center" : "flex-start",
        }}>
          <Icon name="logout" size={16} color="rgba(255,255,255,0.45)" />
          {!collapsed && "Cerrar Sesión"}
        </button>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════
//  MAIN APP
// ═══════════════════════════════════════════════════════
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#e89754",
  "dashVariant": "A",
  "sidebarCollapsed": false,
  "compactMode": false,
  "fontScale": 1
}/*EDITMODE-END*/;

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { accentColor, dashVariant, sidebarCollapsed, compactMode, fontScale } = tweaks;

  const [module, setModule] = useState("dashboard");
  const [collapsed, setCollapsed] = useState(sidebarCollapsed);

  useEffect(() => { setCollapsed(sidebarCollapsed); }, [sidebarCollapsed]);

  const moduleContent = {
    dashboard: <DashboardModule dashVariant={dashVariant} accentColor={accentColor} />,
    inventory: <InventoryModule accentColor={accentColor} />,
    fiscal: <FiscalModule accentColor={accentColor} />,
    services: <ServicesModule accentColor={accentColor} />,
    clients: <ClientsModule accentColor={accentColor} />,
    suppliers: <SuppliersModule accentColor={accentColor} />,
    reports: <ReportsModule accentColor={accentColor} />,
    users: <UsersModule accentColor={accentColor} />,
  };

  return (
    <div style={{ display: "flex", height: "100vh", width: "100vw", fontSize: `${fontScale * 100}%`, background: "#F0F4F8" }}>
      <Sidebar active={module} onNavigate={setModule} collapsed={collapsed} accentColor={accentColor} />
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", minWidth: 0 }}>
        <TopBar module={module} onToggleSidebar={() => setCollapsed(c => !c)} accentColor={accentColor} />
        <main style={{ flex: 1, overflow: "hidden", background: "#F0F4F8" }}>
          {moduleContent[module]}
        </main>
      </div>

      <TweaksPanel>
        <TweakSection label="Apariencia" />
        <TweakColor label="Color principal" value={accentColor} onChange={v => setTweak("accentColor", v)} />
        <TweakToggle label="Sidebar compacto" value={sidebarCollapsed} onChange={v => setTweak("sidebarCollapsed", v)} />
        <TweakToggle label="Modo compacto" value={compactMode} onChange={v => setTweak("compactMode", v)} />
        <TweakSlider label="Escala de texto" value={fontScale} min={0.85} max={1.2} step={0.05} onChange={v => setTweak("fontScale", v)} />
        <TweakSection label="Dashboard — Variante" />
        <TweakRadio label="Diseño del panel" value={dashVariant}
          options={["A", "B", "C"]}
          onChange={v => setTweak("dashVariant", v)} />
      </TweaksPanel>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
